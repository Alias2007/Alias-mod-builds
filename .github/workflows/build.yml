name: build
run-name: build ${{ inputs.job }}
# Untrusted mod code runs only in the no-network sandbox; the publish job alone can write results.
on:
  workflow_dispatch:
    inputs:
      job:
        description: The job the game follows
        required: true
      ask:
        description: The sealed mods' name in the requests release
        required: true
      key:
        description: Decryption key; never written to this workflow file
        required: true
      version:
        description: A version in versions.json
        required: true
      tools:
        description: The branch of starling-client/starling with the build scripts
        default: starling
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      VERSION: ${{ inputs.version }}
      TOOLS: ${{ inputs.tools }}
      ASK: ${{ inputs.ask }}
      JOB: ${{ inputs.job }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: The commit and the scripts
        run: bash scripts/prepare.sh
      - name: Make room
        run: bash scripts/room.sh
      - uses: actions/cache/restore@v4
        id: base-cache
        with:
          key: base-${{ env.COMMIT }}
          fail-on-cache-miss: true
          path: |
            ~/.rustup
            ~/android
            ~/modbuild/cargo
            ~/modbuild/base
      - name: Check the offline build environment
        run: |
          test -x "$HOME/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/bin/rustc"
          test -f "$HOME/android/platforms/android-36/android.jar"
          test -x "$HOME/modbuild/cargo/bin/cargo-ndk"
          test -x "$HOME/modbuild/base"/mixins-*/bin/horizon-mixins
          test -f "$HOME/modbuild/cargo/env"
          echo "Trusted offline build cache is ready."
      - name: The mods
        run: bash scripts/unseal.sh
      - name: Build
        env:
          MOD_BUILD_SECONDS: '3200'
        run: python3 tools/mod_build_once.py mods.bin "$COMMIT" result
      - uses: actions/upload-artifact@v4
        with:
          name: result
          path: result/
          retention-days: 1
          compression-level: 1
          if-no-files-found: error
  publish:
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      JOB: ${{ inputs.job }}
      ASK: ${{ inputs.ask }}
      BUILT: ${{ needs.build.result }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: needs.build.result == 'success'
        continue-on-error: true
        with:
          name: result
          path: result/
      - name: The answer
        run: python3 scripts/publish.py
